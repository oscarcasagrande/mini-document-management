# DocReader PoC: ingestion, OCR, classification and structured extraction, all local.
#
#   docker compose up --build
#
# Five mandatory services, as recommended in section 30 of the PRD. postgres and ocr-service publish no
# port here; docker-compose.dev.yml adds them for development.

name: docreader

services:
  web-bff:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web-bff
    image: docreader/web-bff:local
    restart: unless-stopped
    environment:
      # Server side address of the API. The browser never sees it: the BFF proxies every call.
      DOCREADER_API_BASE_URL: http://api:8080
      # Addresses the browser does need, because the Swagger link opens in a new tab.
      DOCREADER_PUBLIC_SWAGGER_URL: http://localhost:${API_PORT:-8080}/swagger
      DOCREADER_MAX_UPLOAD_BYTES: ${UPLOAD_MAX_SIZE_BYTES:-26214400}
      DOCREADER_MAX_PAGE_COUNT: ${UPLOAD_MAX_PAGE_COUNT:-50}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - public
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    image: docreader/api:local
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-docreader};Username=${POSTGRES_USER:-docreader};Password=${POSTGRES_PASSWORD:-docreader};Include Error Detail=false"
      # Migrations are explicit. The compose file is the one place that opts in, so a single
      # docker compose up is enough to get a migrated schema.
      DocReader__Database__RunMigrationsOnStartup: "true"
      DocReader__Storage__RootPath: /var/lib/docreader/storage
      DocReader__Upload__MaxSizeBytes: ${UPLOAD_MAX_SIZE_BYTES:-26214400}
      DocReader__Upload__MaxPageCount: ${UPLOAD_MAX_PAGE_COUNT:-50}
      DocReader__Idempotency__Ttl: ${IDEMPOTENCY_KEY_TTL:-24:00:00}
      DocReader__Security__AllowAnonymousAccess: ${ALLOW_ANONYMOUS_ACCESS:-true}
      DocReader__Security__AllowedCorsOrigins__0: http://localhost:${WEB_PORT:-3000}
      DocReader__Ocr__BaseUrl: http://ocr-service:8000
      # The status endpoint reports "attempt N of M", so the API needs the same limit as the worker.
      DocReader__Queue__MaxAttempts: ${QUEUE_MAX_ATTEMPTS:-3}
      # The classification diagnostics endpoint replays the decision, so it needs the worker's setting.
      DocReader__Classification__MinimumScore: ${CLASSIFICATION_MIN_SCORE:-0}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - public
      - internal
    volumes:
      - document-storage:/var/lib/docreader/storage
    depends_on:
      postgres:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    image: docreader/worker:local
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-docreader};Username=${POSTGRES_USER:-docreader};Password=${POSTGRES_PASSWORD:-docreader}"
      DocReader__Storage__RootPath: /var/lib/docreader/storage
      DocReader__Ocr__BaseUrl: http://ocr-service:8000
      # Budget of one page as seen by the worker. It must stay above OCR_PAGE_TIMEOUT_SECONDS of the OCR
      # service, so the service answers 504 first and the failure carries a precise code.
      DocReader__Ocr__PageTimeout: ${OCR_WORKER_PAGE_TIMEOUT:-00:02:30}
      DocReader__Queue__MaxAttempts: ${QUEUE_MAX_ATTEMPTS:-3}
      DocReader__Queue__RetryBaseDelay: ${QUEUE_RETRY_BASE_DELAY:-00:00:15}
      # Silence after which a job is taken from its worker. The worker renews it after every page, so this
      # is not a limit on the document; it must stay above the page timeout (checked at startup).
      DocReader__Queue__JobLockTimeout: ${QUEUE_JOB_LOCK_TIMEOUT:-00:05:00}
      DocReader__Classification__MinimumScore: ${CLASSIFICATION_MIN_SCORE:-0}
    networks:
      - internal
    volumes:
      - document-storage:/var/lib/docreader/storage
    depends_on:
      postgres:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ocr-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.ocr-service
    image: docreader/ocr-service:local
    restart: unless-stopped
    environment:
      OCR_PROVIDER: paddleocr
      OCR_MODEL_CACHE_DIR: /var/lib/docreader/ocr-models
      # Detector and recognizer: ppocrv5-mobile (default, models baked into the image), ppocrv6-medium,
      # ppocrv6-small or ppocrv6-tiny. Another profile downloads its models on first start (ADR 0002).
      OCR_MODEL_PROFILE: ${OCR_MODEL_PROFILE:-ppocrv5-mobile}
      OCR_LOG_LEVEL: ${OCR_LOG_LEVEL:-INFO}
      # One page at a time: the memory budget below was sized for it (ADR 0002).
      OCR_MAX_CONCURRENCY: ${OCR_MAX_CONCURRENCY:-1}
      # Wall clock budget of a page, waiting for a slot included.
      OCR_PAGE_TIMEOUT_SECONDS: ${OCR_PAGE_TIMEOUT_SECONDS:-120}
      OCR_PDF_DPI: ${OCR_PDF_DPI:-200}
      OCR_MAX_IMAGE_SIDE: ${OCR_MAX_IMAGE_SIDE:-3200}
      OCR_MAX_UPLOAD_BYTES: ${UPLOAD_MAX_SIZE_BYTES:-26214400}
      # oneDNN needs the paddlepaddle build pinned in requirements.txt; set false with any other build.
      OCR_ENABLE_MKLDNN: ${OCR_ENABLE_MKLDNN:-true}
      OMP_NUM_THREADS: ${OCR_THREADS:-4}
    # Explicit memory ceiling: the measured peak is about 2.3 GB, and a runaway page must kill this
    # container (which restarts) instead of taking the machine with it. Swap is off so the limit is real.
    mem_limit: ${OCR_MEMORY_LIMIT:-3g}
    memswap_limit: ${OCR_MEMORY_LIMIT:-3g}
    # No published port: the OCR service is reachable only from the internal network.
    networks:
      - internal
    volumes:
      - ocr-model-cache:/var/lib/docreader/ocr-models

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docreader}
      POSTGRES_USER: ${POSTGRES_USER:-docreader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docreader}
      # Keeps the database deterministic regardless of the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
      PGTZ: UTC
    # No published port: the database is reachable only from the internal network.
    networks:
      - internal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready --username=${POSTGRES_USER:-docreader} --dbname=${POSTGRES_DB:-docreader}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  # Browser facing: the interface and the API.
  public:
    driver: bridge
  # Service to service: API, worker, OCR and database.
  internal:
    driver: bridge

volumes:
  postgres-data:
  document-storage:
  ocr-model-cache:
